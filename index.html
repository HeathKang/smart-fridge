<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲜知 · 我的冰箱</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6ef;color:#243c30;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{background:#24513e;color:white;padding:28px max(5%,calc((100% - 1000px)/2));}header h1{margin:8px 0}header p{color:#cadfd0}main{max-width:1000px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 8px 28px #234b3810;margin-bottom:18px}h2{margin:0 0 8px}p,small{color:#71867a;line-height:1.7}label{display:block;color:#516b5b;font-size:13px;margin:12px 0 5px}input,select{width:100%;padding:10px;border:1px solid #d8e3d9;border-radius:8px;background:white;font:inherit;color:#263d30}button,.upload{border:0;border-radius:8px;background:#285d46;color:white;padding:10px 14px;cursor:pointer;font:inherit}button.secondary{background:#eef4ed;color:#355e47}button.danger{background:#f9efea;color:#a45b42}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.item{border-top:1px solid #edf1eb;padding:15px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.item strong{font-size:17px}.tag{color:#a85d2d;background:#fff0e1;border-radius:20px;padding:5px 9px;font-size:12px}.tag.ok{background:#eef6eb;color:#628364}.candidate{border:1px solid #e1eae0;padding:12px;border-radius:10px;margin-top:12px}.candidate .fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.candidate input[type=checkbox]{width:auto}.message{color:#ad5939;white-space:pre-wrap}.hidden{display:none}a{color:#4c795d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><small style="color:#b9d5c2">FRESHLY · 家庭冰箱助手</small><h1>鲜知，我的冰箱</h1><p>把快到期的食材放在眼前，让每一份新鲜都被记得。</p></header><main><div class="grid"><section><div class="card"><h2>冰箱里的食材</h2><p>按建议食用日期排序 · <span id="stats"></span></p><div id="items"></div><p>日期仅供参考，请结合包装日期、储存条件与实际状态判断。</p></div></section><section><div class="card"><h2>添加食材</h2><p>订单截图批量识别，或填写名称估算日期；结果都可以修改后再入库。</p><label for="delivered">送达日期</label><input id="delivered" type="date"><label for="storage">储存方式</label><select id="storage"><option>冷藏</option><option>冷冻</option><option>常温</option></select><label for="image">订单截图或单个食材图片（JPG / PNG / WebP，最大 6 MB）</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions"><button id="recognize">识别图片</button></div><label for="name">或者手动输入食材名称</label><input id="name" placeholder="例如：菠菜"><div class="actions"><button id="estimate" class="secondary">估算日期</button><button id="manual" class="secondary">手动填写</button></div><p class="message" id="message" role="status"></p><div id="review" class="hidden"><h3>确认食材</h3><p>识别和日期均可能有误，请逐项检查；包装日期优先。未勾选的项目不会入库。</p><div id="candidates"></div><div class="actions"><button id="save">确认入库</button><button id="cancel" class="secondary">取消</button></div></div></div><p><a href="/discussion.html">查看产品与技术讨论稿 →</a></p></section></div></main><script>
const $=id=>document.getElementById(id);let draft=[], editId=null;const localDay=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('delivered').value=localDay();async function api(path,method='GET',body){let r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}function msg(t){$('message').textContent=t}function days(date){let a=new Date(date+'T00:00:00'),b=new Date(localDay()+'T00:00:00');return Math.round((a-b)/86400000)}async function refresh(){try{let items=await api('/api/items');$('stats').textContent=`${items.length} 项，${items.filter(x=>days(x.expires)<=3).length} 项需关注`;let root=$('items');root.replaceChildren();if(!items.length){root.textContent='还没有食材，从右侧添加第一项吧。';return}items.forEach(x=>{let row=document.createElement('div');row.className='item';let text=document.createElement('div'),title=document.createElement('strong'),detail=document.createElement('small'),tag=document.createElement('span'),actions=document.createElement('div');title.textContent=x.name;detail.style.display='block';detail.textContent=`${x.quantity||'数量未填写'} · ${x.storage} · 送达 ${x.delivered} · ${x.estimated?'估算':'手动'} ${x.expires}`;let n=days(x.expires);tag.className='tag '+(n>3?'ok':'');tag.textContent=n<0?'已过预计日期':n===0?'今天到期':`${n} 天后`;let edit=document.createElement('button');edit.className='secondary';edit.textContent='编辑';edit.onclick=()=>{editId=x.id;draft=[{...x,checked:true}];renderDraft();$('review').scrollIntoView({behavior:'smooth'})};let del=document.createElement('button');del.className='danger';del.textContent='吃完了';del.onclick=async()=>{try{await api('/api/items/'+x.id,'DELETE');refresh()}catch(e){msg(e.message)}};text.append(title,detail);actions.className='actions';actions.append(tag,edit,del);row.append(text,actions);root.append(row)})}catch(e){msg(e.message)}}function renderDraft(){let root=$('candidates');root.replaceChildren();$('review').classList.remove('hidden');draft.forEach((x,i)=>{let box=document.createElement('div');box.className='candidate';let check=document.createElement('input');check.type='checkbox';check.checked=x.checked!==false;check.onchange=()=>x.checked=check.checked;let label=document.createElement('label');label.append(check,document.createTextNode(' 加入 / 保存这一项'));box.append(label);let fields=document.createElement('div');fields.className='fields';[['name','食材名称','text'],['quantity','数量','text'],['delivered','送达日期','date'],['expires','建议食用日期','date']].forEach(([key,title,type])=>{let wrap=document.createElement('div'),l=document.createElement('label'),input=document.createElement('input');l.textContent=title;input.type=type;input.value=x[key]||'';input.oninput=()=>{x[key]=input.value;if(key==='expires')x.estimated=false};wrap.append(l,input);fields.append(wrap)});let wrap=document.createElement('div'),l=document.createElement('label'),sel=document.createElement('select');l.textContent='储存方式';['冷藏','冷冻','常温'].forEach(v=>{let o=document.createElement('option');o.textContent=v;o.selected=x.storage===v;sel.append(o)});sel.onchange=()=>x.storage=sel.value;wrap.append(l,sel);fields.append(wrap);box.append(fields);root.append(box)})}async function suggest(image){msg('正在请求模型，请稍候…');try{let data=await api('/api/suggest','POST',{name:$('name').value,delivered:$('delivered').value,storage:$('storage').value,image});draft=data.items.map(x=>({...x,checked:true}));editId=null;if(!draft.length){msg('没有识别到可用食材，请重试或手动填写。');return}renderDraft();msg('请检查识别结果和预计日期。')}catch(e){msg(e.message)}}$('recognize').onclick=()=>{let f=$('image').files[0];if(!f){msg('请先选择图片。');return}if(f.size>6000000){msg('图片不能超过 6 MB。');return}let reader=new FileReader();reader.onload=()=>suggest(reader.result);reader.readAsDataURL(f)};$('estimate').onclick=()=>{if(!$('name').value.trim()){msg('请先填写食材名称。');return}suggest(null)};$('manual').onclick=()=>{editId=null;draft=[{name:$('name').value,quantity:'',storage:$('storage').value,delivered:$('delivered').value,expires:$('delivered').value,estimated:false,checked:true}];renderDraft();msg('请填写食材及建议食用日期。')};$('cancel').onclick=()=>{$('review').classList.add('hidden');draft=[];editId=null};$('save').onclick=async()=>{let selected=draft.filter(x=>x.checked);if(!selected.length){msg('请至少勾选一项。');return}try{if(editId)await api('/api/items/'+editId,'PUT',selected[0]);else await api('/api/items','POST',{items:selected});$('review').classList.add('hidden');draft=[];editId=null;$('image').value='';$('name').value='';msg('已保存。');refresh()}catch(e){msg(e.message)}};refresh();
</script></body></html>
